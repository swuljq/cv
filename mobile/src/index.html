<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipBridge</title>
<style>body{font-family:system-ui;margin:24px;background:#f6f7f9}input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border:1px solid #ccd1d8;border-radius:8px}button{background:#2563eb;color:#fff;border:0}#status{margin-top:16px;color:#475569}</style>
<h2>ClipBridge Android</h2>
<input id="server" value="ws://192.168.1.10:8787" placeholder="服务器地址">
<input id="user" value="clipbridge" placeholder="账号">
<input id="password" value="clipbridge-dev" type="password" placeholder="密码">
<button id="connect">连接并开始同步</button>
<div id="status">未连接</div>
<script type="module">
import { Clipboard } from '@capacitor/clipboard';
const $ = id => document.getElementById(id);
let socket; let last = '';
const id = () => (globalThis.crypto?.randomUUID?.() || ("android-" + Date.now() + "-" + Math.random().toString(16).slice(2)));
function status(v){ $('status').textContent = v; }
async function poll(){
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  const value = await Clipboard.read();
  if (value.type === 'text' && value.value && value.value !== last) { last = value.value; socket.send(JSON.stringify({type:'clipboard',eventId:id(),contentType:'text',data:value.value})); }
}
function connect(){
  socket = new WebSocket($('server').value);
  socket.onopen = () => { socket.send(JSON.stringify({type:'auth',username:$('user').value,password:$('password').value,deviceId:id(),deviceName:'Android'})); status('连接中…'); };
  socket.onmessage = async event => { const m=JSON.parse(event.data); if(m.type==='auth_ok') status('已连接'); if(m.type==='clipboard' && m.contentType==='text'){ last=m.data; await Clipboard.write({string:m.data}); status('已同步文本'); } };
  socket.onclose = () => status('连接断开'); socket.onerror = () => status('连接错误');
}
$('#connect').onclick = connect; setInterval(poll, 1200);
</script>
