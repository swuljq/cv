<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipBridge</title>
<style>body{font-family:system-ui;margin:24px;background:#f6f7f9}input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border:1px solid #ccd1d8;border-radius:8px}button{background:#2563eb;color:#fff;border:0}#status{margin-top:16px;color:#475569;font-weight:600}#log{white-space:pre-wrap;word-break:break-word;background:#111827;color:#d1fae5;border-radius:8px;padding:10px;height:180px;overflow:auto;font:12px monospace}</style>
<h2>ClipBridge Android</h2>
<input id="server" value="ws://10.153.65.179:8787" placeholder="服务器地址">
<input id="user" value="clipbridge" placeholder="账号">
<input id="password" value="clipbridge-dev" type="password" placeholder="密码">
<button id="connect">连接并开始同步</button>
<div id="status">未连接</div>
<pre id="log">等待操作…</pre>
<script type="module">
import { registerPlugin } from '@capacitor/core';
const $ = id => document.getElementById(id);
let socket; let last = '';
const Clipboard = registerPlugin('ClipboardBridge');
const id = () => (globalThis.crypto?.randomUUID?.() || ("android-" + Date.now() + "-" + Math.random().toString(16).slice(2)));
function log(v){ const line = `[${new Date().toLocaleTimeString()}] ${v}`; $('log').textContent = `${line}\n${$('log').textContent}`.slice(0, 5000); }
function status(v){ $('status').textContent = v; log(v); }
log('应用脚本已加载，原生剪贴板桥接已注册');
async function poll(){
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  try {
    const value = await Clipboard.read();
    if (value.type === 'text' && value.value && value.value !== last) { last = value.value; socket.send(JSON.stringify({type:'clipboard',eventId:id(),contentType:'text',data:value.value})); log('已发送文本剪贴板事件'); }
  } catch (error) { log(`剪贴板读取失败：${error?.message || error}`); }
}
function connect(){
  const url = $('server').value.trim();
  log(`点击连接，地址：${url}`);
  if (!/^wss?:\/\//.test(url)) { status('地址格式错误'); return; }
  try { socket?.close(); socket = new WebSocket(url); status('正在建立 WebSocket 连接…'); }
  catch (error) { status(`创建连接失败：${error?.message || error}`); return; }
  socket.onopen = () => { log('WebSocket 已打开，正在发送登录信息'); socket.send(JSON.stringify({type:'auth',username:$('user').value,password:$('password').value,deviceId:id(),deviceName:'Android'})); status('已发送登录信息，等待服务器响应…'); };
  socket.onmessage = async event => { log(`收到服务器消息：${event.data}`); try { const m=JSON.parse(event.data); if(m.type==='auth_ok') status('已连接'); if(m.type==='error') status(`服务器拒绝：${m.code || '未知错误'}`); if(m.type==='clipboard' && m.contentType==='text'){ last=m.data; await Clipboard.write({string:m.data}); status('已同步文本'); } } catch(error) { log(`处理消息失败：${error?.message || error}`); } };
  socket.onclose = event => status(`连接断开（code=${event.code}）`); socket.onerror = () => status('WebSocket 网络错误，请检查地址和防火墙');
}
window.addEventListener('DOMContentLoaded', () => { $('connect').addEventListener('click', () => { log('按钮点击事件已触发'); connect(); }); log('按钮事件已绑定'); }); setInterval(poll, 1200);
</script>
