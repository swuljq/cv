<!doctype html>
<meta charset="utf-8">
<title>ClipBridge</title>
<style>body{font-family:system-ui;margin:24px;background:#f6f7f9}input,button{box-sizing:border-box;width:100%;padding:10px;margin:6px 0;border:1px solid #ccd1d8;border-radius:8px}button{background:#2563eb;color:white;border:0;cursor:pointer}#status{margin-top:14px;color:#475569}</style>
<h2>ClipBridge</h2>
<input id="server" value="ws://127.0.0.1:8787" placeholder="服务器地址">
<input id="user" value="clipbridge" placeholder="账号">
<input id="password" value="clipbridge-dev" type="password" placeholder="密码">
<button id="connect">连接并开始同步</button>
<div id="status">未连接</div>
<script>const $=id=>document.getElementById(id);$('connect').onclick=()=>{window.clipbridge.connect({serverUrl:$('server').value,username:$('user').value,password:$('password').value,deviceId:crypto.randomUUID()});$('status').textContent='连接中…'};window.clipbridge.onStatus(v=>$('status').textContent=v)</script>
